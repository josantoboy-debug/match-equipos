name: UNITCHECK suite branding gate

on:
  push:
    branches:
      - main
      - repair/unitcheck-suite-name-20260831
    paths:
      - 'index.html'
      - 'unitcheck-brand.css'
      - 'assets/unitcheck-mark.svg'
      - '.github/workflows/unitcheck-brand-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'unitcheck-brand.css'
      - 'assets/unitcheck-mark.svg'
      - '.github/workflows/unitcheck-brand-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static suite-brand contract
        shell: bash
        run: |
          set -euo pipefail
          BRAND='20260831-suitebrand1'
          for file in *.js; do node --check "$file"; done
          grep -F "data-brand-version=\"${BRAND}\"" index.html
          grep -F '<title>UNITCHECK · Match</title>' index.html
          grep -F "unitcheck-brand.css?v=${BRAND}" index.html
          grep -F "assets/unitcheck-mark.svg?v=${BRAND}" index.html
          grep -F 'aria-label="UNITCHECK · Match"' index.html
          grep -F '>UNITCHECK · Generador</span>' index.html
          grep -F '>UNITCHECK · Match</span>' index.html
          ! grep -F 'unitcheck-logo.webp' index.html
          ! grep -F 'REGISTRO Y VERIFICACION' index.html
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('assets/unitcheck-mark.svg').getroot()
          assert root.attrib.get('viewBox')=='0 0 96 96'
          assert 'svg' in root.tag
          print('UNITCHECK_SVG_XML_OK')
          PY
          for ref in $(grep -Eo '(src|href)="[^"?#]+\.(js|css|svg)' index.html | sed -E 's/^(src|href)="//' | grep -vE '^https?://'); do
            test -f "$ref" || { echo "Missing referenced asset: $ref"; exit 1; }
          done
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0
      - name: Start local app
        run: |
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/unitcheck-suite-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4176/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/unitcheck-suite-http.log
          exit 1
      - name: Desktop tablet mobile suite-brand smoke
        shell: bash
        run: |
          cat >/tmp/unitcheck-suite-smoke.cjs <<'NODE'
          const assert=require('assert');
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const BRAND='20260831-suitebrand1';
          const views=[['desktop',1536,864,125],['tablet',820,1180,185],['mobile',390,844,245]];
          const cors={'access-control-allow-origin':'*','access-control-allow-headers':'apikey,content-type,authorization,x-client-info,prefer','access-control-allow-methods':'POST,OPTIONS,GET'};
          const overlap=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',args:['--no-sandbox','--disable-setuid-sandbox']});
            for(const [name,width,height,maxHeader] of views){
              const page=await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1});
              await page.setCacheEnabled(name==='mobile');
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.setRequestInterception(true);
              page.on('request',r=>{
                const u=r.url();
                if(u.includes('/rpc/core_list_operators_service')){
                  if(r.method()==='OPTIONS') return r.respond({status:204,headers:cors,body:''});
                  return r.respond({status:200,contentType:'application/json',headers:cors,body:'{"ok":true,"bootstrapped":true,"operators":[]}'});
                }
                if(/^https:\/\/(?:cdn\.jsdelivr\.net|cdn\.sheetjs\.com)/.test(u)) return r.respond({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body:'window.XLSX=window.XLSX||{};'});
                if(u.startsWith('https://yvlayxmhcngdqribcmkh.supabase.co/')){
                  if(r.method()==='OPTIONS') return r.respond({status:204,headers:cors,body:''});
                  return r.respond({status:200,contentType:'application/json',headers:cors,body:'{"ok":true}'});
                }
                r.continue();
              });
              await page.goto(`http://127.0.0.1:4176/?suite=${name}`,{waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForFunction(()=>{const i=document.querySelector('.unitcheck-mark');return i?.complete&&i.naturalWidth>0},{timeout:5000});
              const s=await page.evaluate(BRAND=>{
                document.documentElement.dataset.theme='light';
                const lock=document.querySelector('#operatorLock'); if(lock) lock.style.display='none';
                document.querySelector('main.app')?.removeAttribute('inert');
                const a=document.querySelector('.top-actions'); if(a) a.innerHTML='<span style="min-width:155px">OPERADOR · Prueba</span><button>Cerrar sesión</button>';
                const r=e=>{const x=e.getBoundingClientRect();return{left:x.left,right:x.right,top:x.top,bottom:x.bottom,width:x.width,height:x.height}};
                const brand=document.querySelector('.unitcheck-brand'),nav=document.querySelector('.app-suite-nav'),actions=document.querySelector('.top-actions'),header=document.querySelector('.topbar'),mark=document.querySelector('.unitcheck-mark');
                return {title:document.title,version:document.documentElement.dataset.brandVersion,brandVersion:brand?.dataset.brandVersion,src:mark?.getAttribute('src'),natural:[mark?.naturalWidth,mark?.naturalHeight],brandText:brand?.textContent.replace(/\s+/g,' ').trim(),navText:nav?.textContent.replace(/\s+/g,' ').trim(),header:r(header),brand:r(brand),nav:r(nav),actions:r(actions),scroll:document.documentElement.scrollWidth,width:innerWidth};
              },BRAND);
              assert.strictEqual(s.title,'UNITCHECK · Match');
              assert.strictEqual(s.version,BRAND);
              assert.strictEqual(s.brandVersion,BRAND);
              assert.match(s.src,new RegExp(`assets/unitcheck-mark\\.svg\\?v=${BRAND}`));
              assert.deepStrictEqual(s.natural,[96,96]);
              assert.strictEqual(s.brandText,'UNITCHECK · Match');
              assert.ok(s.navText.includes('UNITCHECK · Generador')&&s.navText.includes('UNITCHECK · Match'));
              assert.ok(s.scroll<=s.width+1,`${name}: horizontal overflow`);
              assert.ok(s.header.height<=maxHeader,`${name}: header too tall ${s.header.height}`);
              assert.strictEqual(overlap(s.brand,s.nav),0,`${name}: brand/nav overlap`);
              assert.strictEqual(overlap(s.brand,s.actions),0,`${name}: brand/actions overlap`);
              assert.strictEqual(overlap(s.nav,s.actions),0,`${name}: nav/actions overlap`);
              await Promise.race([page.evaluate(()=>new Promise(r=>setTimeout(r,100))),new Promise((_,rej)=>setTimeout(()=>rej(new Error('event loop blocked')),2000))]);
              assert.deepStrictEqual(errors,[]);
              console.log(`UNITCHECK_MATCH_${name.toUpperCase()}_OK header=${s.header.height.toFixed(1)}`);
              await page.close();
            }
            await browser.close();
            console.log('UNITCHECK_MATCH_SUITE_GATE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/unitcheck-suite-smoke.cjs

  verify-public-brand:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Wait for suite brand on public Pages
        shell: bash
        env:
          PUBLIC_URL: https://josantoboy-debug.github.io/match-equipos/
        run: |
          set -uo pipefail
          BRAND='20260831-suitebrand1'
          ok=0
          for attempt in {1..36}; do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            code=$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/live.html -w '%{http_code}' "${PUBLIC_URL}?suite=${nonce}" || true)
            if [ "$code" = '200' ] && grep -F "data-brand-version=\"${BRAND}\"" /tmp/live.html >/dev/null && grep -F '<title>UNITCHECK · Match</title>' /tmp/live.html >/dev/null && grep -F "assets/unitcheck-mark.svg?v=${BRAND}" /tmp/live.html >/dev/null && grep -F '>UNITCHECK · Generador</span>' /tmp/live.html >/dev/null && grep -F '>UNITCHECK · Match</span>' /tmp/live.html >/dev/null; then
              css_code=$(curl -sS -L --max-time 15 -o /tmp/brand.css -w '%{http_code}' "${PUBLIC_URL}unitcheck-brand.css?v=${BRAND}&verify=${nonce}" || true)
              svg_code=$(curl -sS -L --max-time 15 -o /tmp/mark.svg -w '%{http_code}' "${PUBLIC_URL}assets/unitcheck-mark.svg?v=${BRAND}&verify=${nonce}" || true)
              if [ "$css_code" = '200' ] && [ "$svg_code" = '200' ] && grep -F 'Brand version: 20260831-suitebrand1' /tmp/brand.css >/dev/null && grep -F 'viewBox="0 0 96 96"' /tmp/mark.svg >/dev/null; then
                echo "UNITCHECK_MATCH_PUBLIC_OK url=${PUBLIC_URL} http=${code} brand=${BRAND}"
                ok=1; break
              fi
            fi
            sleep 5
          done
          test "$ok" = '1'
