name: TTS browser integration and publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tts-integration.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect TTS module to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="voice-notifications.js?v=351105b"></script>'
          if tag not in s:
              marker = '<script src="export-summary.js?v=1a4c24c"></script>'
              if marker not in s:
                  raise SystemExit('No se encontró el punto de carga para TTS')
              s = s.replace(marker, marker + '\n' + tag, 1)
          p.write_text(s, encoding='utf-8')

      - name: JavaScript syntax check
        run: |
          node --check voice-notifications.js
          grep -F 'voice-notifications.js?v=351105b' index.html

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/match-http.log 2>&1 &
          echo $! > /tmp/match-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/match-http.log
          exit 1

      - name: Chromium TTS integration smoke test
        shell: bash
        run: |
          cat > /tmp/tts-smoke.cjs <<'NODE'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const assert = require('assert');

          async function waitForSpoken(page, needle, timeout = 3000) {
            await page.waitForFunction(
              needle => Array.isArray(window.__spoken) && window.__spoken.some(text => String(text).toLowerCase().includes(String(needle).toLowerCase())),
              {timeout}, needle
            );
          }

          (async () => {
            const executablePath = process.env.CHROME_BIN || '/usr/bin/google-chrome';
            const browser = await puppeteer.launch({headless:true, executablePath, args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page = await browser.newPage();

            await page.evaluateOnNewDocument(() => {
              window.__spoken = [];
              class MockUtterance {
                constructor(text) {
                  this.text = String(text || '');
                  this.lang = '';
                  this.voice = null;
                  this.rate = 1;
                  this.pitch = 1;
                  this.volume = 1;
                  this.onstart = null;
                  this.onend = null;
                  this.onerror = null;
                }
              }
              window.SpeechSynthesisUtterance = MockUtterance;
              window.speechSynthesis = {
                getVoices: () => [{name:'Mock Spanish Panama', lang:'es-PA', default:true}],
                speak: utterance => {
                  window.__spoken.push(utterance.text);
                  setTimeout(() => {
                    try { utterance.onstart && utterance.onstart(); } catch {}
                    try { utterance.onend && utterance.onend(); } catch {}
                  }, 10);
                },
                cancel: () => {},
                addEventListener: () => {}
              };
            });

            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/?tts-smoke=1', {waitUntil:'domcontentloaded', timeout:15000});
            await page.waitForSelector('#ttsToggleBtn', {timeout:5000});
            await page.waitForSelector('#ttsLoginControl', {timeout:5000});

            const apiState = await page.evaluate(() => ({
              supported: window.MatchVoiceTTS?.supported,
              enabled: window.MatchVoiceTTS?.isEnabled?.(),
              loginText: document.querySelector('#ttsLoginToggle')?.textContent,
              voice: window.MatchVoiceTTS?.getVoice?.()
            }));
            assert.strictEqual(apiState.supported, true, 'TTS API should report supported with mock engine');
            assert.strictEqual(apiState.enabled, true, 'TTS should default to enabled');
            assert.match(apiState.loginText || '', /ACTIVADA/i, 'Login TTS control should show ACTIVADA');
            assert.strictEqual(apiState.voice?.lang, 'es-PA', 'Spanish Panama voice should be selected');

            await page.click('#ttsLoginTest');
            await waitForSpoken(page, 'Prueba de voz');

            await page.evaluate(() => { window.__spoken = []; });
            await page.evaluate(() => {
              const toast = document.querySelector('#toast');
              toast.className = 'toast show ok';
              toast.innerHTML = '<strong>Cantidad completada</strong><span>Caja 3: 64/64. Abriendo impresión automática.</span>';
            });
            await waitForSpoken(page, 'Cantidad completada');
            await waitForSpoken(page, '64 de 64');

            await page.evaluate(() => { window.__spoken = []; });
            await page.evaluate(() => {
              const panel = document.querySelector('#equipmentValidationMessage');
              panel.className = 'equipment-validation error';
              panel.innerHTML = '<span></span><div><strong>SERIAL inválido</strong><small>El dato se borró automáticamente; vuelve a escanear.</small></div>';
            });
            await waitForSpoken(page, 'SERIAL inválido');

            await page.evaluate(() => { window.__spoken = []; });
            await page.evaluate(() => {
              const panel = document.querySelector('#resultPanel');
              panel.className = 'result ok';
              panel.innerHTML = '<div></div><div><h3>MATCH CORRECTO</h3><p>Host SN y UA coinciden.</p></div>';
            });
            await waitForSpoken(page, 'MATCH CORRECTO');

            await page.evaluate(() => { window.__spoken = []; });
            await page.evaluate(() => {
              document.querySelector('#equipmentPrintMode').value = 'automatic';
              document.dispatchEvent(new CustomEvent('equipment:box-complete', {detail:{box:'03', count:64, capacity:64}}));
            });
            await waitForSpoken(page, 'Caja 03 completa');
            await waitForSpoken(page, 'impresión automática');

            await page.evaluate(() => { window.__spoken = []; });
            await page.evaluate(() => { document.querySelector('#cFound').textContent = '1'; });
            await waitForSpoken(page, 'Equipo encontrado');

            await page.evaluate(() => {
              window.__spoken = [];
              window.MatchVoiceTTS.setEnabled(false, {announceState:false});
              const toast = document.querySelector('#toast');
              toast.className = 'toast show error';
              toast.innerHTML = '<strong>Error único de prueba</strong><span>No debe hablar con TTS desactivado.</span>';
            });
            await new Promise(resolve => setTimeout(resolve, 450));
            const disabledCount = await page.evaluate(() => window.__spoken.length);
            assert.strictEqual(disabledCount, 0, 'Disabled TTS must not speak');

            await page.evaluate(() => {
              window.MatchVoiceTTS.setEnabled(true, {announceState:false});
              window.MatchVoiceTTS.announce('Confirmación final de TTS.', {dedupeMs:0});
            });
            await waitForSpoken(page, 'Confirmación final de TTS');

            const history = await page.evaluate(() => window.MatchVoiceTTS.getHistory());
            assert.ok(history.some(item => item.event === 'start'), 'TTS history should record utterance starts');
            assert.ok(pageErrors.length === 0, `Page errors detected: ${pageErrors.join(' | ')}`);

            console.log('TTS_SMOKE_OK', JSON.stringify({utterancesTested:7, historyEntries:history.length, voice:apiState.voice}));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/tts-smoke.cjs

      - name: Commit TTS integration after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index already contains TTS module"
            exit 0
          fi
          git commit -m "Enable verified TTS notifications in app"
          git push
