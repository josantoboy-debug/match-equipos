name: Verify TTS welcome integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tts-integration.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch welcome and connect TTS
        shell: python
        run: |
          from pathlib import Path

          voice = Path('voice-notifications.js')
          s = voice.read_text(encoding='utf-8')
          old = "announce(name ? `Sesión iniciada. Operador ${name}.` : 'Sesión iniciada.', {priority:'high', key:`operator-login:${name}`, dedupeMs:1500});"
          new = "announce(name ? `Bienvenida ${name}` : 'Bienvenida', {priority:'high', interrupt:true, key:`operator-login:${name}`, dedupeMs:1500});"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('No se encontró el anuncio de login esperado')
          voice.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          tag = '<script src="voice-notifications.js?v=welcome-20260829"></script>'
          if 'voice-notifications.js' not in h:
              marker = '<script src="export-summary.js?v=1a4c24c"></script>'
              if marker not in h:
                  raise SystemExit('No se encontró el punto de carga para TTS')
              h = h.replace(marker, marker + '\n' + tag, 1)
          index.write_text(h, encoding='utf-8')

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
          grep -F 'voice-notifications.js' index.html
          grep -F 'Bienvenida ${name}' voice-notifications.js

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/match-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/match-http.log
          exit 1

      - name: Chromium welcome TTS smoke test
        shell: bash
        run: |
          cat > /tmp/tts-welcome.cjs <<'NODE'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const assert = require('assert');
          (async () => {
            const browser = await puppeteer.launch({headless:true, executablePath:process.env.CHROME_BIN || '/usr/bin/google-chrome', args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page = await browser.newPage();
            await page.evaluateOnNewDocument(() => {
              window.__spoken = [];
              class MockUtterance { constructor(text){ this.text=String(text||''); this.lang=''; this.voice=null; this.rate=1; this.pitch=1; this.volume=1; } }
              const mockSpeech = {
                getVoices: () => [{name:'Mock Spanish Panama',lang:'es-PA',default:true}],
                speak: u => { window.__spoken.push(u.text); setTimeout(()=>{ try{u.onstart&&u.onstart()}catch{} try{u.onend&&u.onend()}catch{} },5); },
                cancel: () => {}, addEventListener: () => {}
              };
              Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,writable:true,value:MockUtterance});
              Object.defineProperty(window,'speechSynthesis',{configurable:true,get:()=>mockSpeech});
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/?tts-welcome=1',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForSelector('#ttsLoginTest',{timeout:5000});
            await page.click('#ttsLoginTest');
            await page.evaluate(()=>{ window.__spoken=[]; document.dispatchEvent(new CustomEvent('operator:login',{detail:{id:'test',name:'Marcos Rodríguez'}})); });
            await page.waitForFunction(()=>window.__spoken.some(t=>t.includes('Bienvenida Marcos Rodríguez')),{timeout:3000});
            const state=await page.evaluate(()=>({spoken:window.__spoken, supported:window.MatchVoiceTTS?.supported, voice:window.MatchVoiceTTS?.getVoice?.()}));
            assert.strictEqual(state.supported,true);
            assert.strictEqual(state.voice?.lang,'es-PA');
            assert.strictEqual(errors.length,0,errors.join(' | '));
            console.log('MATCH_TTS_WELCOME_OK',JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/tts-welcome.cjs

      - name: Commit only after verification passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html voice-notifications.js
          if git diff --cached --quiet; then
            echo "TTS welcome integration already verified and published"
            exit 0
          fi
          git commit -m "Enable verified personalized TTS welcome"
          git push
