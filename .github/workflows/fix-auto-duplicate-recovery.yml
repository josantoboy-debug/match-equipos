name: Fix automatic duplicate recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-auto-duplicate-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover automatic capture after duplicate
        shell: python
        run: |
          from pathlib import Path

          p = Path('equipment-register.js')
          s = p.read_text(encoding='utf-8')
          old = """    const dup = duplicateCheck(v.serial.value, v.ua.value, registry.editingId);
    if (dup) {
      setMessage('error', 'Registro duplicado bloqueado', dup);
      showToast('No se agregó', dup, 'error');
      return false;
    }
"""
          new = """    const dup = duplicateCheck(v.serial.value, v.ua.value, registry.editingId);
    if (dup) {
      const automaticRecovery = registry.captureMode === 'automatic' && !registry.editingId;
      const detail = automaticRecovery
        ? `${dup} Se omitió el duplicado y el registro automático continúa.`
        : dup;
      setMessage('error', 'Registro duplicado bloqueado', detail);
      showToast('No se agregó', detail, 'error');

      if (automaticRecovery) {
        const serialInput = $('#equipmentSerial');
        const uaInput = $('#equipmentUA');
        if (serialInput) {
          serialInput.value = '';
          serialInput.classList.remove('field-valid', 'field-invalid');
        }
        if (uaInput) {
          uaInput.value = '';
          uaInput.classList.remove('field-valid', 'field-invalid');
        }
        requestAnimationFrame(() => {
          serialInput?.focus({preventScroll:true});
          try { serialInput?.setSelectionRange(0, 0); } catch {}
        });
      }
      return false;
    }
"""
          if old not in s:
              raise SystemExit('No se encontró el bloque actual de duplicados')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          import re
          html2, n = re.subn(r'equipment-register\.js\?v=[^"\']+', 'equipment-register.js?v=dup-recovery-20260829', html, count=1)
          if n != 1:
              raise SystemExit('No se encontró equipment-register.js en index.html')
          idx.write_text(html2, encoding='utf-8')

      - name: Verify automatic duplicate recovery
        run: |
          node --check equipment-register.js
          grep -F "Se omitió el duplicado y el registro automático continúa." equipment-register.js
          grep -F "serialInput.value = '';" equipment-register.js
          grep -F "uaInput.value = '';" equipment-register.js
          grep -F "serialInput?.focus({preventScroll:true});" equipment-register.js
          grep -F 'equipment-register.js?v=dup-recovery-20260829' index.html

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-auto-duplicate-recovery.yml
          git add equipment-register.js index.html .github/workflows/fix-auto-duplicate-recovery.yml
          git commit -m "Keep automatic capture running after duplicate"
          git push
