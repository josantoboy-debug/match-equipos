name: Legacy register import compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-register-import-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch legacy register loading
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Keep strict 18-digit validation for new capture, but accept
          # historical 16-digit UA values when importing saved registers.
          p = Path('equipment-register.js')
          s = p.read_text(encoding='utf-8')

          marker = """  function validateBox(value) {"""
          compatibility = """  // Compatibilidad de carga: los registros históricos exportados por la app pueden tener UA de 16 dígitos.\n  // La captura nueva conserva validateUA() con la regla actual de 18 dígitos.\n  function validateImportedUA(value) {\n    const normalized = normUA(value);\n    if (!normalized) return {valid:false, value:normalized, message:'El UA / Unit Address es obligatorio.'};\n    if (!/^\\d+$/.test(normalized)) return {valid:false, value:normalized, message:'El UA / Unit Address solo puede contener dígitos.'};\n    if (!normalized.startsWith('0000')) return {valid:false, value:normalized, message:'El UA / Unit Address debe iniciar con 0000.'};\n    if (!/^0000(?:\\d{12}|\\d{14})$/.test(normalized)) return {valid:false, value:normalized, message:'El UA importado debe tener 16 o 18 dígitos e iniciar con 0000.'};\n    return {valid:true, value:normalized, message:''};\n  }\n\n"""
          if 'function validateImportedUA(value)' not in s:
              if marker not in s:
                  raise SystemExit('No se encontró validateBox para insertar compatibilidad UA')
              s = s.replace(marker, compatibility + marker, 1)

          old_import = "      const ua = validateUA(source.ua);"
          new_import = "      const ua = validateImportedUA(source.ua);"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('No se encontró validación UA del importador')

          # Both legacy 16-zero and current 18-zero UA are unknown values.
          if "const UNKNOWN_UA = '000000000000000000';" in s and 'const isUnknownImportedUA' not in s:
              s = s.replace(
                  "const UNKNOWN_UA = '000000000000000000';",
                  "const UNKNOWN_UA = '000000000000000000';\n  const isUnknownImportedUA = value => /^(?:0{16}|0{18})$/.test(String(value || ''));",
                  1
              )
              s = s.replace("if (ua !== UNKNOWN_UA) {", "if (!isUnknownImportedUA(ua)) {", 1)

          p.write_text(s, encoding='utf-8')

          # 2) Old exports did not contain CANTIDAD. They came from the legacy
          # 64-per-box flow, so a missing quantity restores to 64 rather than
          # treating the current count as the final capacity.
          p = Path('equipment-import-context.js')
          s = p.read_text(encoding='utf-8')
          old1 = "quantity: normalizeQuantity(fileContext?.quantity) || normalizeQuantity(rowContext.quantity) || Math.min(MAX_PER_BOX, Math.max(1, rowContext.count))"
          new1 = "quantity: normalizeQuantity(fileContext?.quantity) || normalizeQuantity(rowContext.quantity) || MAX_PER_BOX"
          old2 = "context.quantity = normalizeQuantity(fileContext.quantity) || Math.min(MAX_PER_BOX, Math.max(1, matching.length));"
          new2 = "context.quantity = normalizeQuantity(fileContext.quantity) || MAX_PER_BOX;"
          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif new1 not in s:
              raise SystemExit('No se encontró fallback principal de CANTIDAD')
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit('No se encontró fallback de CANTIDAD para caja coincidente')
          p.write_text(s, encoding='utf-8')

          # 3) Force fresh browser versions.
          p = Path('audit-fixes.js')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"equipment-import-context\.js\?v=[A-Za-z0-9._-]+", "equipment-import-context.js?v=legacy64-20260829b", s, count=1)
          if n != 1 and 'equipment-import-context.js?v=legacy64-20260829b' not in s:
              raise SystemExit('No se pudo versionar equipment-import-context.js')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r"equipment-register\.js\?v=[A-Za-z0-9._-]+", "equipment-register.js?v=legacyload-20260829b", s, count=1)
          s, n2 = re.subn(r"audit-fixes\.js\?v=[A-Za-z0-9._-]+", "audit-fixes.js?v=legacyload-20260829b", s, count=1)
          if n1 != 1 and 'equipment-register.js?v=legacyload-20260829b' not in s:
              raise SystemExit('No se pudo versionar equipment-register.js')
          if n2 != 1 and 'audit-fixes.js?v=legacyload-20260829b' not in s:
              raise SystemExit('No se pudo versionar audit-fixes.js')
          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript syntax
        run: |
          node --check equipment-register.js
          node --check equipment-import-context.js
          node --check audit-fixes.js

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipment-register.js equipment-import-context.js audit-fixes.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix legacy register loading and resume box capacity"
          git push