name: Admin PIN reset gate

on:
  push:
    branches:
      - fix/admin-recovery-onetime
    paths:
      - 'admin-reset-pin.html'
      - 'admin-reset-pin.js'
      - '.github/workflows/admin-pin-reset.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-reset-pin.html'
      - 'admin-reset-pin.js'
      - '.github/workflows/admin-pin-reset.yml'

permissions:
  contents: read

jobs:
  admin-pin-reset-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax references and security
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-reset-pin.js
          grep -F 'admin-reset-pin.js?v=20260831-2' admin-reset-pin.html
          grep -F '/functions/v1/operator-api' admin-reset-pin.js
          grep -F "api('reset_pin'" admin-reset-pin.js
          grep -F "api('emergency_reset_pin'" admin-reset-pin.js
          grep -F 'sb_publishable_' admin-reset-pin.js
          if grep -F '/rest/v1/rpc/core_admin_reset_pin_service' admin-reset-pin.js; then
            echo 'Privileged reset RPC must not be called directly by browser code'
            exit 1
          fi
          if grep -Eiq 'sb_secret_[A-Za-z0-9_-]{10,}' admin-reset-pin.html admin-reset-pin.js; then
            echo 'Supabase secret key found in browser code'
            exit 1
          fi
          if grep -Eiq 'service_role[[:space:]]*[:=]' admin-reset-pin.html admin-reset-pin.js; then
            echo 'Service credential assignment found in browser code'
            exit 1
          fi
          if grep -Eq 'localStorage|sessionStorage|document\.write' admin-reset-pin.js; then
            echo 'Credentials must remain memory-only and document.write is forbidden'
            exit 1
          fi

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local application
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 > /tmp/admin-pin-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4176/admin-reset-pin.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/admin-pin-http.log
          exit 1

      - name: Desktop tablet mobile normal and emergency flows
        shell: bash
        run: |
          cat > /tmp/admin-pin-smoke.cjs <<'NODE'
          const assert = require('assert');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const admin={id:'00000000-0000-4000-8000-000000000001',name:'Usuario Admin',role:'admin',active:true,version:1};
          const user={id:'00000000-0000-4000-8000-000000000002',name:'Operador Prueba',role:'operator',active:true,version:1};
          const TEST_ADMIN_PIN='2468', TEST_NEW_PIN='1357', TEST_RECOVERY_CODE='TEST-RECOVERY-CODE', TEST_TOKEN='TEST_TOKEN_NOT_REAL';
          const viewports=[{name:'desktop',width:1366,height:768},{name:'tablet',width:768,height:1024},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',args:['--no-sandbox','--disable-setuid-sandbox']});
            for(const viewport of viewports){
              const page=await browser.newPage();
              await page.setViewport({width:viewport.width,height:viewport.height,deviceScaleFactor:1});
              const pageErrors=[],consoleErrors=[]; let resetPayload=null,recoveryPayload=null;
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
              page.on('dialog',d=>d.accept());
              await page.setRequestInterception(true);
              page.on('request',request=>{
                if(request.url()!=='https://yvlayxmhcngdqribcmkh.supabase.co/functions/v1/operator-api') return request.continue();
                const headers={'access-control-allow-origin':'http://127.0.0.1:4176','access-control-allow-headers':'apikey,content-type,x-operator-session','access-control-allow-methods':'POST,OPTIONS','content-type':'application/json'};
                if(request.method()==='OPTIONS') return request.respond({status:204,headers});
                let body={}; try{body=JSON.parse(request.postData()||'{}')}catch{}
                const token=request.headers()['x-operator-session']||'';
                if(body.action==='list') return request.respond({status:200,headers,body:JSON.stringify({ok:true,operators:[admin,user]})});
                if(body.action==='login'){
                  const ok=body.operator_id===admin.id&&body.pin===TEST_ADMIN_PIN&&body.app_name==='admin';
                  return request.respond({status:200,headers,body:JSON.stringify(ok?{ok:true,token:TEST_TOKEN,operator:admin}:{ok:false,code:'INVALID_PIN',remaining_attempts:4})});
                }
                if(body.action==='reset_pin'){
                  resetPayload={body,token};
                  const ok=token===TEST_TOKEN&&body.operator_id===user.id&&body.new_pin===TEST_NEW_PIN;
                  return request.respond({status:ok?200:403,headers,body:JSON.stringify(ok?{ok:true}:{ok:false,code:'FORBIDDEN'})});
                }
                if(body.action==='emergency_reset_pin'){
                  recoveryPayload=body;
                  const ok=body.activation_code===TEST_RECOVERY_CODE&&body.new_pin===TEST_NEW_PIN;
                  return request.respond({status:ok?200:403,headers,body:JSON.stringify(ok?{ok:true,operator:admin}:{ok:false,code:'INVALID_RECOVERY_CODE',remaining_attempts:4})});
                }
                if(body.action==='logout') return request.respond({status:200,headers,body:JSON.stringify({ok:true})});
                return request.respond({status:400,headers,body:JSON.stringify({ok:false,code:'UNKNOWN_ACTION'})});
              });
              await page.goto(`http://127.0.0.1:4176/admin-reset-pin.html?test=${viewport.name}`,{waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForFunction(()=>document.querySelector('#adminSelect')?.options.length===1,{timeout:5000});
              let state=await page.evaluate(()=>({admin:document.querySelector('#adminSelect')?.selectedOptions?.[0]?.textContent,resetHidden:document.querySelector('#resetPanel')?.hidden,recoveryHidden:document.querySelector('#emergencyPanel')?.hidden,local:localStorage.length,session:sessionStorage.length,overflow:document.documentElement.scrollWidth>innerWidth}));
              assert.deepStrictEqual(state,{admin:'Usuario Admin',resetHidden:true,recoveryHidden:false,local:0,session:0,overflow:false});

              await page.type('#recoveryCode',TEST_RECOVERY_CODE); await page.type('#recoveryPin',TEST_NEW_PIN); await page.type('#recoveryPinConfirm',TEST_NEW_PIN); await page.click('#emergencyResetBtn');
              await page.waitForFunction(()=>document.querySelector('#recoveryCode')?.value===''&&document.querySelector('#recoveryPin')?.value==='',{timeout:5000});
              assert.strictEqual(recoveryPayload.action,'emergency_reset_pin'); assert.strictEqual(recoveryPayload.activation_code,TEST_RECOVERY_CODE); assert.strictEqual(recoveryPayload.new_pin,TEST_NEW_PIN);

              await page.type('#adminPin',TEST_ADMIN_PIN); await page.click('#adminLoginBtn');
              await page.waitForFunction(()=>document.querySelector('#resetPanel')?.hidden===false,{timeout:5000});
              await page.select('#targetOperator',user.id); await page.type('#newPin',TEST_NEW_PIN); await page.type('#confirmPin',TEST_NEW_PIN); await page.click('#resetPinBtn');
              await page.waitForFunction(()=>document.querySelector('#status')?.dataset.type==='success',{timeout:5000});
              assert.strictEqual(resetPayload.token,TEST_TOKEN); assert.strictEqual(resetPayload.body.action,'reset_pin'); assert.strictEqual(resetPayload.body.operator_id,user.id); assert.strictEqual(resetPayload.body.new_pin,TEST_NEW_PIN);
              state=await page.evaluate(()=>({local:localStorage.length,session:sessionStorage.length,tokenVisible:document.body.innerText.includes('TEST_TOKEN_NOT_REAL'),overflow:document.documentElement.scrollWidth>innerWidth}));
              assert.deepStrictEqual(state,{local:0,session:0,tokenVisible:false,overflow:false});
              assert.deepStrictEqual(pageErrors,[]); assert.deepStrictEqual(consoleErrors,[]);
              const responsive=await Promise.race([page.evaluate(()=>new Promise(r=>setTimeout(()=>r('ok'),100))),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Browser event loop blocked')),2000))]); assert.strictEqual(responsive,'ok');
              await page.close();
            }
            await browser.close(); console.log('ADMIN_PIN_RESET_GATE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/admin-pin-smoke.cjs
