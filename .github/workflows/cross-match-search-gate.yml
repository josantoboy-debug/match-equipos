name: Cross match search gate

on:
  push:
    branches:
      - repair/cross-match-search-20260831
      - repair/search-index-hybrid-20260901
      - main
    paths:
      - index.html
      - search-mode.js
      - match-cross-contract.js
      - match-cross-search.js
      - match-cross-search.css
      - .github/workflows/cross-match-search-gate.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - search-mode.js
      - match-cross-contract.js
      - match-cross-search.js
      - match-cross-search.css
      - .github/workflows/cross-match-search-gate.yml

permissions:
  contents: read

jobs:
  cross-match-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and references
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do node --check "$file"; done
          grep -F 'data-cross-match-version="20260901-searchindex1"' index.html
          grep -F 'match-cross-contract.js?v=20260901-searchindex1' index.html
          grep -F 'match-cross-search.js?v=20260901-searchindex1' index.html
          grep -F 'match-cross-search.css?v=20260901-searchindex1' index.html
          grep -F 'search-mode.js?v=20260831-autoclear3-crossmatch1' index.html
          grep -F 'Cruce + índice universal' index.html
          grep -F 'Un Match se crea únicamente con la validación estricta Host SN + UA.' index.html
          grep -F 'crossMatchFolderInput' index.html
          test -s match-cross-contract.js
          test -s match-cross-search.js
          test -s match-cross-search.css
          ! grep -R 'document\.write' match-cross-contract.js match-cross-search.js search-mode.js

      - name: Contract matching and universal index tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('assert');
          const C=require('./match-cross-contract.js');
          assert.strictEqual(C.canonicalCode('000-01174-04427-010'),'117404427010');
          assert.strictEqual(C.canonicalCode('0000117404427010'),'117404427010');
          assert.strictEqual(C.classifyCode('000-01174-04427-010'),'CARCASA');
          assert.strictEqual(C.classifyCode('M91504EQL152'),'EQUIPO');

          const wb=C.parseWorkbookModel('Equipos_macth.xlsx',[
            {name:'Equipos sin carcasa',rows:[
              ['SR','UA','NOTA'],
              ['M91504EQL152','000-01174-04427-010','REVISION-ABC'],
              ['MV2022VR3097','0000181679117166','']
            ]},
            {name:'Carcasa equipos',rows:[['SR','UA'],['M91845ERCL12','0000180129859246']]},
            {name:'Hoja auxiliar',rows:[['CODIGO-AUX','LOTE-77']]}
          ]);
          assert.strictEqual(wb.records.length,4);
          assert.strictEqual(wb.records[0].role,'EQUIPO');
          assert.ok(wb.errors.some(e=>e.sheet==='Hoja auxiliar'));

          const a=C.parseTxt(
            '000-01174-04427-010\tM91504EQL152\n' +
            '000-01816-79117-166\tMV2022VR3097\n' +
            'CODIGO-SUELTO-77',
            'DATA_08_DCX525.txt'
          );
          const b=C.parseTxt(
            '0000117404427010\tM91504EQL152\n' +
            '0000180129859246;M91845ERCL12',
            'DATA_09.txt'
          );
          assert.strictEqual(a.records[2].pairValid,false);
          assert.strictEqual(a.errors.length,1);
          assert.strictEqual(b.records[1].pairValid,true);

          const allTxt=[...a.records,...b.records];
          const idx=C.buildDiscoveryIndex(wb.records,allTxt);

          let d=C.discoverySearch('REVISIONABC',idx);
          assert.strictEqual(d.length,1);
          assert.strictEqual(d[0].source,'EXCEL');
          assert.strictEqual(d[0].field,'NOTA');
          assert.strictEqual(d[0].rowNumber,2);

          d=C.discoverySearch('CODIGOSUELTO77',idx);
          assert.strictEqual(d.length,1);
          assert.strictEqual(d[0].source,'TXT');
          assert.strictEqual(d[0].lineNumber,3);
          assert.strictEqual(d[0].pairValid,false);

          d=C.discoverySearch('M91504EQL152',idx);
          assert.strictEqual(d.length,3);

          let r=C.search('M91504EQL152',wb.records,allTxt,{discoveryIndex:idx});
          assert.strictEqual(r.excelHits.length,1);
          assert.strictEqual(r.txtHits.length,2);
          assert.strictEqual(r.links.length,2);
          assert.ok(r.links.every(x=>x.exactPair));
          assert.strictEqual(r.discoveryHits.length,3);

          r=C.search('0000117404427010',wb.records,a.records);
          assert.strictEqual(r.links[0].excel.sheet,'Equipos sin carcasa');
          assert.strictEqual(r.links[0].excel.rowNumber,2);
          assert.strictEqual(r.links[0].txt.lineNumber,1);

          r=C.search('11740442',wb.records,a.records);
          assert.ok(r.links.length===1);

          r=C.search('CODIGOSUELTO77',wb.records,a.records);
          assert.strictEqual(r.links.length,0);
          assert.strictEqual(r.discoveryHits.length,1);

          r=C.search('NOEXISTE123',wb.records,a.records);
          assert.strictEqual(r.total,0);
          assert.strictEqual(r.discoveryHits.length,0);

          console.log('HYBRID_INDEX_CONTRACT_OK exact=ok partial=ok all_cells=ok single_txt=ok multi_origin=ok strict_match=ok');
          NODE

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local app
        shell: bash
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/crossmatch-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4178/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crossmatch-http.log
          exit 1

      - name: Browser smoke desktop tablet mobile and stale cache
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          cat >/tmp/crossmatch-browser.cjs <<'NODE'
          const assert=require('assert');
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const VERSION='20260901-searchindex1';
          const cors={
            'access-control-allow-origin':'*',
            'access-control-allow-headers':'apikey,content-type,authorization,x-client-info,prefer',
            'access-control-allow-methods':'POST,OPTIONS,GET'
          };
          async function run(browser,name,width,height,stale=false){
            const page=await browser.newPage();
            await page.setViewport({width,height,deviceScaleFactor:1});
            const errors=[],requests=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const u=req.url(); requests.push(u);
              if(stale&&u.includes(`match-cross-search.css?v=${VERSION}`)) return req.respond({status:200,contentType:'text/css',body:'.cross-match-source-box{display:block}.cross-match-grid{display:grid}.cross-source-hit{display:block}'});
              if(/^https:\/\/cdn\.sheetjs\.com/.test(u)) return req.respond({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body:'window.XLSX=window.XLSX||{};'});
              if(u.includes('yvlayxmhcngdqribcmkh.supabase.co')){
                if(req.method()==='OPTIONS') return req.respond({status:204,headers:cors,body:''});
                if(u.includes('core_list_operators_service')) return req.respond({status:200,contentType:'application/json',headers:cors,body:'{"ok":true,"bootstrapped":true,"operators":[]}'});
                return req.respond({status:200,contentType:'application/json',headers:cors,body:'{"ok":true}'});
              }
              req.continue();
            });
            await page.goto(`http://127.0.0.1:4178/?hybrid=${name}`,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(()=>window.MatchCrossSearch&&window.MatchSearchModes&&document.querySelector('#operatorLock'),{timeout:10000});
            const lock=await page.$eval('#operatorLock',el=>({display:getComputedStyle(el).display,visible:el.getBoundingClientRect().height>0}));
            assert.ok(lock.display!=='none'&&lock.visible,`${name}: login lock not visible`);
            assert.ok(await page.$('#operatorSelect'),`${name}: operator selector missing`);
            await page.evaluate(()=>{const lock=document.querySelector('#operatorLock');if(lock)lock.style.display='none';document.querySelector('main.app')?.removeAttribute('inert');});
            await page.evaluate(()=>{
              MatchCrossSearch.ingestWorkbookModel('Equipos_macth.xlsx',[
                {name:'Equipos sin carcasa',rows:[['SR','UA','NOTA'],['M91504EQL152','000-01174-04427-010','REVISION-ABC']]},
                {name:'Carcasa equipos',rows:[['SR','UA'],['M91845ERCL12','0000180129859246']]}
              ]);
              MatchCrossSearch.ingestTxtText('DATA_08_DCX525.txt','000-01174-04427-010\tM91504EQL152\n000-01801-29859-246\tM91845ERCL12\nCODIGO-SUELTO-77');
              MatchCrossSearch.ingestTxtText('DATA_09.txt','0000117404427010\tM91504EQL152');
              const input=document.querySelector('#searchInput');input.value='M91504EQL152';MatchSearchModes.executeSearch();
            });

            const exact=await page.$$eval('.cross-match-card.exact',els=>els.length);
            assert.strictEqual(exact,2,`${name}: expected two strict exact cross-source hits`);
            let text=await page.$eval('.cross-match-section',el=>el.textContent);
            assert.ok(text.includes('Equipos sin carcasa')&&text.includes('fila 2')&&text.includes('línea 1'),`${name}: traceability missing`);
            let stats=await page.evaluate(()=>MatchCrossSearch.getStats());
            assert.deepStrictEqual(stats,{excelFile:'Equipos_macth.xlsx',excelRecords:2,txtFiles:2,txtRecords:4,indexedValues:12,errors:1});

            await page.evaluate(()=>{const i=document.querySelector('#searchInput');i.value='REVISIONABC';MatchSearchModes.executeSearch();});
            text=await page.$eval('.cross-match-section',el=>el.textContent);
            assert.ok(text.includes('REVISION-ABC')&&text.includes('columna NOTA')&&text.includes('fila 2'),`${name}: extra Excel column not discoverable`);

            await page.evaluate(()=>{const i=document.querySelector('#searchInput');i.value='CODIGOSUELTO77';MatchSearchModes.executeSearch();});
            text=await page.$eval('.cross-match-section',el=>el.textContent);
            assert.ok(text.includes('CODIGO-SUELTO-77')&&text.includes('línea 3')&&text.includes('no crea Match'),`${name}: single-column TXT provenance/safety missing`);
            assert.strictEqual(await page.$$eval('.cross-match-card',els=>els.length),0,`${name}: generic TXT created structured link`);

            await page.evaluate(()=>{const i=document.querySelector('#searchInput');i.value='11740442';MatchSearchModes.executeSearch();});
            assert.ok((await page.$$eval('.cross-match-card',els=>els.length))>=2,`${name}: partial query failed`);

            await page.evaluate(()=>{const i=document.querySelector('#searchInput');i.value='NOEXISTE123';MatchSearchModes.executeSearch();});
            assert.ok(await page.$('.cross-match-empty'),`${name}: no-match message missing`);

            const geom=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth,box:document.querySelector('.cross-match-source-box').getBoundingClientRect().width,panel:document.querySelector('.search-panel').getBoundingClientRect().width}));
            assert.ok(geom.scroll<=geom.width+1,`${name}: horizontal overflow ${geom.scroll}/${geom.width}`);
            assert.ok(geom.box>0&&geom.box<=geom.panel+1,`${name}: source box overflow`);
            assert.ok(requests.some(u=>u.includes(`match-cross-contract.js?v=${VERSION}`)));
            assert.ok(requests.some(u=>u.includes(`match-cross-search.js?v=${VERSION}`)));
            assert.ok(requests.some(u=>u.includes('search-mode.js?v=20260831-autoclear3-crossmatch1')));
            await Promise.race([page.evaluate(()=>new Promise(r=>setTimeout(r,100))),new Promise((_,rej)=>setTimeout(()=>rej(new Error(`${name}: event loop blocked`)),2000))]);
            assert.deepStrictEqual(errors,[],`${name}: console/page errors ${JSON.stringify(errors)}`);
            console.log(`HYBRID_INDEX_${name.toUpperCase()}_OK exact=${exact} indexed=${stats.indexedValues} overflow=none stale=${stale}`);
            await page.close();
          }
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox']});
            await run(browser,'desktop',1536,864,false);
            await run(browser,'tablet',820,1180,false);
            await run(browser,'mobile',390,844,false);
            await run(browser,'mobile-stale',390,844,true);
            await browser.close();
            console.log('HYBRID_INDEX_BROWSER_GATE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/crossmatch-browser.cjs

  verify-public-cross-match:
    if: github.ref == 'refs/heads/main'
    needs: cross-match-search
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public hybrid search version
        shell: bash
        env:
          PUBLIC_URL: https://josantoboy-debug.github.io/match-equipos/
        run: |
          set -uo pipefail
          ok=0
          for attempt in {1..36}; do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            code=$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/live.html -w '%{http_code}' "${PUBLIC_URL}?searchindex=${nonce}" || true)
            if [ "$code" = 200 ] \
              && grep -F 'data-cross-match-version="20260901-searchindex1"' /tmp/live.html >/dev/null \
              && grep -F 'match-cross-contract.js?v=20260901-searchindex1' /tmp/live.html >/dev/null \
              && grep -F 'match-cross-search.js?v=20260901-searchindex1' /tmp/live.html >/dev/null \
              && grep -F 'search-mode.js?v=20260831-autoclear3-crossmatch1' /tmp/live.html >/dev/null; then
              js1=$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/contract.js -w '%{http_code}' "${PUBLIC_URL}match-cross-contract.js?v=20260901-searchindex1&verify=${nonce}" || true)
              js2=$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/search.js -w '%{http_code}' "${PUBLIC_URL}match-cross-search.js?v=20260901-searchindex1&verify=${nonce}" || true)
              css=$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/cross.css -w '%{http_code}' "${PUBLIC_URL}match-cross-search.css?v=20260901-searchindex1&verify=${nonce}" || true)
              if [ "$js1" = 200 ] && [ "$js2" = 200 ] && [ "$css" = 200 ] \
                && grep -F "const VERSION='20260901-searchindex1'" /tmp/search.js >/dev/null \
                && grep -F 'buildDiscoveryIndex' /tmp/contract.js >/dev/null \
                && grep -F 'cross-match-source-box' /tmp/cross.css >/dev/null; then
                echo "HYBRID_INDEX_PUBLIC_OK url=${PUBLIC_URL} http=${code} version=20260901-searchindex1"
                ok=1; break
              fi
            fi
            echo "Attempt ${attempt}: public hybrid search version not ready; retrying"
            sleep 5
          done
          test "$ok" = 1
